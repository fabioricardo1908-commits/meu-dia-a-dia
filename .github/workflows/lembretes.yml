name: Lembretes
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lembretes
  cancel-in-progress: false
jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # o que já foi enviado hoje fica no cache do Actions (o workflow não grava nada no repositório)
      - name: Lembrar o que já foi enviado
        uses: actions/cache/restore@v4
        with:
          path: servidor/estado.json
          key: lembretes-estado-${{ github.run_id }}
          restore-keys: lembretes-estado-
      - run: npm install --prefix servidor --no-audit --no-fund
      - run: node servidor/enviar.mjs
        env:
          LEMBRETES: ${{ secrets.LEMBRETES }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - name: Guardar o que já foi enviado
        uses: actions/cache/save@v4
        with:
          path: servidor/estado.json
          key: lembretes-estado-${{ github.run_id }}
