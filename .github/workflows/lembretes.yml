name: Lembretes
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lembretes
  cancel-in-progress: false
jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --prefix servidor --no-audit --no-fund
      - run: node servidor/enviar.mjs
        env:
          LEMBRETES: ${{ secrets.LEMBRETES }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - name: Guardar o que já foi enviado
        run: |
          if [ -n "$(git status --porcelain servidor/estado.json)" ]; then
            git config user.name "lembretes-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add servidor/estado.json
            git commit -m "Lembretes enviados"
            git push
          fi
